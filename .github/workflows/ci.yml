name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Run tests
        run: python -m unittest discover -v

      - name: Smoke test CLI
        run: |
          python -m automatizando_latex.cli init ci-smoke \
            --output-dir "$RUNNER_TEMP" \
            --title "CI smoke test" \
            --author "GitHub Actions"
          test -f "$RUNNER_TEMP/ci-smoke/main.tex"
          test -f "$RUNNER_TEMP/ci-smoke/referencias.bib"

  latex-build:
    name: Compile ABNT article
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LaTeX and BibTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-lang-portuguese \
            texlive-publishers \
            texlive-binaries

      - name: Install package
        run: python -m pip install -e .

      - name: Generate and compile article
        run: |
          python -m automatizando_latex.cli init ci-article \
            --output-dir "$RUNNER_TEMP" \
            --title "Artigo validado pelo CI" \
            --author "GitHub Actions"
          python -m automatizando_latex.cli build "$RUNNER_TEMP/ci-article"

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: artigo-abnt-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-article/main.pdf
          if-no-files-found: error